<!DOCTYPE html>
<html>
<head>
  <title>Book Blood Test</title>
</head>
<body>

<h2>Book Blood Test</h2>

<form onsubmit="bookTest(); return false;">

  <input type="text" id="patientID" placeholder="Patient ID (KHC-2026-XXX)" required><br><br>

  <input type="text" id="name" placeholder="Patient Name" required><br><br>

  <input type="tel" id="mobile" placeholder="Mobile Number" required><br><br>

  <input type="text" id="address" placeholder="Full Address" required><br><br>

  <select id="test" required>
    <option value="">Select Test</option>
    <option>CBC</option>
    <option>Thyroid Profile</option>
    <option>Diabetes</option>
    <option>Full Body Checkup</option>
  </select><br><br>

  <input type="number" id="mrp" placeholder="MRP Amount" required><br><br>

  <input type="number" id="amount" placeholder="Collected Amount" required><br><br>

  <select id="paymentMode" required>
    <option value="">Payment Mode</option>
    <option>Cash</option>
    <option>UPI</option>
  </select><br><br>

  <button type="submit">Confirm Booking</button>
</form>

<p id="msg" style="font-weight:bold;"></p>

<script>
function normalizeMobile(m){
  return m.replace(/\D/g,'').slice(-10);
}

function bookTest(){
  const data = {
    action: "booking",
    patientID: document.getElementById("patientID").value,
    name: document.getElementById("name").value,
    mobile: normalizeMobile(document.getElementById("mobile").value),
    address: document.getElementById("address").value,
    test: document.getElementById("test").value,
    mrp: document.getElementById("mrp").value,
    amount: document.getElementById("amount").value,
    paymentMode: document.getElementById("paymentMode").value,
    paymentStatus: "Pending"
  };

  fetch("https://script.google.com/macros/s/AKfycbwyyKzmo5nfg-mEtKGyalkIJJ9OAk3CLZfHvorJ6-3nPczhePr-R0oYzB_yyBemZm-Y/exec", {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(r => r.json())
  .then(res => {
    if(res.status === "BOOKED"){
      document.getElementById("msg").style.color="green";
      document.getElementById("msg").innerHTML =
        "✅ Booking Successful<br>Status: <b>Pending</b>";
    } else {
      document.getElementById("msg").style.color="red";
      document.getElementById("msg").innerHTML =
        "❌ Booking failed. Try again.";
    }
  })
  .catch(()=>{
    document.getElementById("msg").style.color="red";
    document.getElementById("msg").innerHTML =
      "❌ Server error. Try again.";
  });
}
</script>

</body>
</html>
