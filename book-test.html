<!DOCTYPE html>
<html>
<head>
  <title>Book Blood Test</title>
  <meta charset="UTF-8">
</head>
<body>

<h2>Book Blood Test</h2>

<form onsubmit="bookTest(); return false;">

  <input type="text" id="patientID" placeholder="Patient ID (KHC-XXX)" required><br><br>

  <input type="text" id="name" placeholder="Patient Name" required><br><br>

  <input type="tel" id="mobile" placeholder="Mobile Number" required><br><br>

  <input type="text" id="address" placeholder="Full Address" required><br><br>

  <select id="test" required>
    <option value="">Select Test</option>
    <option value="CBC">CBC</option>
    <option value="Thyroid Profile">Thyroid Profile</option>
    <option value="Diabetes">Diabetes</option>
    <option value="Full Body Checkup">Full Body Checkup</option>
  </select><br><br>

  <input type="number" id="mrp" placeholder="MRP Amount" required><br><br>

  <input type="number" id="amount" placeholder="Collected Amount" required><br><br>

  <select id="paymentMode" required>
    <option value="">Payment Mode</option>
    <option value="Cash">Cash</option>
    <option value="UPI">UPI</option>
  </select><br><br>

  <button type="submit">Confirm Booking</button>
</form>

<p id="msg" style="font-weight:bold;"></p>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz_4PnkH81KcWjBmQysykru812vnX13kx1xIn_MXQfynhsVW1uKWkUAArqC2E_syx1Y/exec";

function normalizeMobile(m){
  return m.replace(/\D/g,'').slice(-10);
}

function bookTest(){

  document.getElementById("msg").style.color = "black";
  document.getElementById("msg").innerHTML = "⏳ Booking in progress...";

  const data = {
    action: "booking",
    patientID: document.getElementById("patientID").value.trim(),
    name: document.getElementById("name").value.trim(),
    mobile: normalizeMobile(document.getElementById("mobile").value),
    address: document.getElementById("address").value.trim(),
    test: document.getElementById("test").value,
    mrp: document.getElementById("mrp").value,
    amount: document.getElementById("amount").value,
    paymentMode: document.getElementById("paymentMode").value,
    paymentStatus: "Pending"
  };

  fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  })
  .then(response => response.json())
  .then(res => {
    if(res.status === "BOOKED"){
      document.getElementById("msg").style.color = "green";
      document.getElementById("msg").innerHTML =
        "✅ Booking Successful<br>Status: <b>Pending</b>";
    } else {
      document.getElementById("msg").style.color = "red";
      document.getElementById("msg").innerHTML =
        "❌ Booking failed. Try again.";
    }
  })
  .catch(error => {
    document.getElementById("msg").style.color = "red";
    document.getElementById("msg").innerHTML =
      "❌ Server error. Try again.";
  });
}
</script>

</body>
</html>
