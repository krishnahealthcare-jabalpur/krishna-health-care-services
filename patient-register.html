<!DOCTYPE html>
<html>
<head>
<title>Patient Registration</title>
</head>
<body>

<h2>New Patient Registration</h2>

<form onsubmit="savePatient(); return false;">
  <input type="text" id="name" placeholder="Full Name" required><br><br>
  <input type="tel" id="mobile" placeholder="Mobile Number" required><br><br>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Create Password" required><br><br>
  <button type="submit">Create Account</button>
</form>

<p id="msg"></p>

<script>
function generatePatientID() {
  let year = new Date().getFullYear();
  let last = localStorage.getItem("KHC_LAST_ID");
  last = last ? parseInt(last) + 1 : 1;
  localStorage.setItem("KHC_LAST_ID", last);
  return "KHC-" + year + "-" + String(last).padStart(4, "0");
}

function savePatient() {
  let patientID = generatePatientID();

  let patient = {
    patientID: patientID,
    name: name.value,
    mobile: mobile.value,
    email: email.value,
    password: password.value
  };

  localStorage.setItem(patient.mobile, JSON.stringify(patient));

  document.getElementById("msg").innerHTML =
    "✅ Account Created Successfully<br><b>Patient ID:</b> " + patientID;
}
</script>

</body>
</html>
