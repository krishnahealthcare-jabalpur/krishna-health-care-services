<!DOCTYPE html>
<html>
<head>
  <title>New Patient Registration</title>
</head>
<body>

<h2>New Patient Registration</h2>

<form onsubmit="registerPatient(); return false;">
  <input type="text" id="name" placeholder="Full Name" required><br><br>
  <input type="tel" id="mobile" placeholder="Mobile Number (10 digit)" required><br><br>
  <input type="email" id="email" placeholder="Email (optional)"><br><br>
  <input type="password" id="password" placeholder="Create Password" required><br><br>
  <button type="submit">Create Account</button>
</form>

<p id="msg" style="font-weight:bold;"></p>

<script>
function normalizeMobile(m){
  return m.replace(/\D/g,'').slice(-10);
}

function registerPatient(){
  const data = {
    action: "register",
    name: document.getElementById("name").value,
    mobile: normalizeMobile(document.getElementById("mobile").value),
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  };

  fetch("https://script.google.com/macros/s/AKfycbz_4PnkH81KcWjBmQysykru812vnX13kx1xIn_MXQfynhsVW1uKWkUAArqC2E_syx1Y/exec", {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(r => r.json())
  .then(res => {
    if(res.status === "EXISTS"){
      document.getElementById("msg").style.color="red";
      document.getElementById("msg").innerHTML="❌ Mobile number already registered";
    } else if(res.status === "OK"){
      document.getElementById("msg").style.color="green";
      document.getElementById("msg").innerHTML =
        "✅ Account Created Successfully<br>Patient ID: <b>"+res.patientID+"</b>";
    } else {
      document.getElementById("msg").style.color="red";
      document.getElementById("msg").innerHTML="❌ Error. Try again.";
    }
  });
}
</script>

</body>
</html>
