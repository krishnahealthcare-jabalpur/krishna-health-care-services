<!DOCTYPE html>
<html>
<head>
  <title>Patient Login</title>
</head>
<body>

<h2>Patient Login</h2>

<form onsubmit="loginPatient(); return false;">
  <input type="tel" id="mobile" placeholder="Registered Mobile Number" required><br><br>
  <input type="password" id="password" placeholder="Password" required><br><br>
  <button type="submit">Login</button>
</form>

<p id="msg" style="font-weight:bold;"></p>

<script>
function normalizeMobile(m){
  return m.replace(/\D/g,'').slice(-10);
}

function loginPatient(){
  const data = {
    action: "login",
    mobile: normalizeMobile(document.getElementById("mobile").value),
    password: document.getElementById("password").value
  };

  fetch("https://script.google.com/macros/s/AKfycbz_4PnkH81KcWjBmQysykru812vnX13kx1xIn_MXQfynhsVW1uKWkUAArqC2E_syx1Y/exec", {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(r => r.json())
  .then(res => {
    if(res.status === "OK"){
      document.getElementById("msg").style.color="green";
      document.getElementById("msg").innerHTML =
        "✅ Login Successful<br>" +
        "Name: <b>" + res.name + "</b><br>" +
        "Patient ID: <b>" + res.patientID + "</b>";
    } else {
      document.getElementById("msg").style.color="red";
      document.getElementById("msg").innerHTML =
        "❌ Invalid mobile number or password";
    }
  })
  .catch(()=>{
    document.getElementById("msg").style.color="red";
    document.getElementById("msg").innerHTML =
      "❌ Server error. Try again.";
  });
}
</script>

</body>
</html>
