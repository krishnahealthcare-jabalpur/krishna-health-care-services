<script>
function normalizeMobile(m){
  return m.replace(/\D/g,'').slice(-10);
}

function loginPatient() {
  let mobile = normalizeMobile(document.getElementById("mobile").value);
  let password = document.getElementById("password").value;

  let data = localStorage.getItem(mobile);
  if (!data) {
    document.getElementById("msg").innerHTML =
      "❌ Account not found. Please use registered mobile number.";
    return;
  }

  let patient = JSON.parse(data);
  if (patient.password === password) {
    document.getElementById("msg").innerHTML =
      "✅ Welcome " + patient.name +
      "<br><b>Patient ID:</b> " + patient.patientID;
  } else {
    document.getElementById("msg").innerHTML = "❌ Wrong password";
  }
}
</script>
